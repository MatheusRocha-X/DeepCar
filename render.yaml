$schema: https://render.com/schema/render.yaml.json

services:
  - type: web
    name: deepcar-backend
    runtime: docker
    plan: starter
    region: oregon
    rootDir: backend
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    numInstances: 1
    disk:
      name: deepcar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/deepcar.db
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"